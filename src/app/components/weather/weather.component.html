<div class="max-w-sm rounded-3xl bg-gradient-to-br from-blue-500 to-indigo-600 p-6 text-white shadow-xl">
  <!-- Top Bar: Location & Status -->

  <ng-content select="topBar"/>

  @if (!hidden()) {
    <ng-content select=".content">
      <p class="text-center text-lg font-medium p-6">No content provided...</p>
    </ng-content>
  }
  <!-- Bottom Details Grid -->
  <ng-content select="[slot='bottomDetails']"/>

  <button (click)="hidden.set(!hidden())" class="text-sm mt-4 bg-white text-blue-500 hover:bg-blue-100 focus:ring-2 focus:ring-blue-300 font-bold py-2 px-4 rounded-lg">
    Toggle Content
  </button>
</div>
