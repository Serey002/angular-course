<h2>Bank Accounts</h2>
<table>
  <thead>
    <tr>
      <th>Account Number</th>
      <th>Customer Name</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (account of accounts; track account.accountNumber) {
      <tr>
        <td>{{ account.accountNumber }}</td>
        <td>{{ account.customerName }}</td>
        <td>
          <button (click)="viewDetail(account.accountNumber)">
            View Detail
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
<hr>
<br>
<app-account-detail [account]="selectedAccount"></app-account-detail>
